<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Sombra para o balão -->
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Fundo grafite arredondado — mesma cor do header do app (#2c2c2c) -->
  <rect width="512" height="512" rx="112" fill="#2c2c2c"/>

  <!-- ===== CAPACETE ===== -->
  <!-- Dome principal: semicírculo com aba larga, cor amarela vibrante -->
  <!-- Aba (brim) — retângulo arredondado em baixo -->
  <rect x="82" y="263" width="290" height="38" rx="19" fill="#FFD600"/>

  <!-- Cúpula — clipada para aparecer só acima da aba -->
  <ellipse cx="227" cy="263" rx="154" ry="140" fill="#FFD600"/>

  <!-- Crista/topo do capacete (detalhe retangular em cima) -->
  <rect x="207" y="98" width="40" height="22" rx="8" fill="#E6C000"/>

  <!-- Sulcos da cúpula (dão profundidade ao capacete) -->
  <line x1="227" y1="120" x2="227" y2="265" stroke="#2c2c2c" stroke-width="7" stroke-linecap="round" opacity="0.35"/>
  <line x1="195" y1="128" x2="175" y2="265" stroke="#2c2c2c" stroke-width="5" stroke-linecap="round" opacity="0.25"/>
  <line x1="259" y1="128" x2="279" y2="265" stroke="#2c2c2c" stroke-width="5" stroke-linecap="round" opacity="0.25"/>

  <!-- ===== BALÃO DE DIÁLOGO ===== -->
  <!-- Corpo do balão -->
  <rect x="208" y="310" width="240" height="148" rx="28" fill="white" filter="url(#sh)"/>
  <!-- Cauda apontando para o capacete (canto inferior esquerdo) -->
  <polygon points="235,458 208,504 275,458" fill="white"/>

  <!-- Texto DDS -->
  <text
    x="328"
    y="408"
    font-family="'Arial Black', 'Arial Bold', Arial, sans-serif"
    font-weight="900"
    font-size="86"
    fill="#2c2c2c"
    text-anchor="middle"
    dominant-baseline="middle"
  >DDS</text>
</svg>
